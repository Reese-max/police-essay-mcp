name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Harness evaluator regression
        run: node --test h2/grade.test.mjs
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-noto-cjk
      - if: matrix.node-version == 20
        run: sudo apt-get install -y libreoffice
      - run: npm test
      - run: npm run build
      - if: matrix.node-version == 20
        run: npm run test:render
        env:
          REQUIRE_DOCX_RENDER: true
      - if: matrix.node-version == 20
        run: npx tsx scripts/all-tools-e2e.ts

